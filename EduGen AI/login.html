<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login / Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="background"></div>
  <div class="container">
    <div class="form-toggle">
      <button id="login-tab" class="active">Login</button>
      <button id="register-tab">Register</button>
    </div>

    <form id="login-form" class="form active" >
      <div class="image-wrapper">
        <img src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=600&q=80" alt="Login" />
      </div>
      <h2>Welcome Back!</h2>
      <input type="email" id="login-email" placeholder="Email" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit" class="btn-primary">Login</button>
    </form>

    <form id="register-form" class="form">
      <div class="image-wrapper">
        <img src="https://images.unsplash.com/photo-1520857012533-c418bca682ee?auto=format&fit=crop&w=600&q=80" alt="Register" />
      </div>
      <h2>Create Account</h2>
      <input type="text" id="register-username" placeholder="Username" required />
      <input type="email" id="register-email" placeholder="Email" required />
      <input type="password" id="register-password" placeholder="Password" required />
      <button type="submit" class="btn-primary">Register</button>
    </form>
  </div>

  <script src="login.js"></script>
</body>
</html>
